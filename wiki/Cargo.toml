[package]
name = "wiki"
version = "0.1.0"
edition = "2024"

[lib]
name = "wiki"
crate-type = ["cdylib"]

[dependencies]
cirrus_config = { path = "../cirrus/config/v1" }
cirrus_git_tag = { path = "../cirrus/git_tag/v1" }

ammonia = { version = "4.1.2", default-features = false }
pulldown-cmark = { version = "0.13.4", features = ["html"], default-features = false}
pyo3 = { version = "0.28.3", features = ["abi3-py312"] }
reqwest = { version = "0.13.2", features = ["blocking"] }